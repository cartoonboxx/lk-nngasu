name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run type-check

  check-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build ./cmd/api ./cmd/createadmin

  check-deployment:
    runs-on: ubuntu-latest
    env:
      FRONTEND_IMAGE: ghcr.io/example/frontend:check
      BACKEND_IMAGE: ghcr.io/example/backend:check
      POSTGRES_PASSWORD: compose-validation-password
      JWT_SECRET: compose-validation-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose -f compose.prod.yaml config --quiet
      - run: bash -n deploy/deploy.sh

  images:
    needs: [check-frontend, check-backend, check-deployment]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            suffix: ''
          - service: backend
            suffix: '-backend'
    steps:
      - uses: actions/checkout@v6
      - name: Image reference
        id: image
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}${IMAGE_SUFFIX}:${GITHUB_SHA}"
          printf 'reference=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile.prod
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy frontend, backend and database
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          frontend_image="${image_base}:${GITHUB_SHA}"
          backend_image="${image_base}-backend:${GITHUB_SHA}"
          tar -czf "$RUNNER_TEMP/deploy.tar.gz" \
            compose.prod.yaml deploy/deploy.sh deploy/nginx-location.conf \
            deploy/.env.example backend/migrations
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'mkdir -p /var/www/lk-nngasu'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'tar -xzf - -C /var/www/lk-nngasu' < "$RUNNER_TEMP/deploy.tar.gz"
          printf '%s' "$GHCR_TOKEN" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /var/www/lk-nngasu/deploy/deploy.sh '$frontend_image' '$backend_image'"
