services:
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://root:K7m!q2Vz@db:5432/nngasu?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET длиной не менее 32 символов}
      ACCESS_TTL: ${ACCESS_TTL:-12h}
      TIMEZONE: Europe/Moscow
      WEEK_ONE_DATE: ${WEEK_ONE_DATE:-2026-09-01}
      LESSON_MINUTES: "90"
      MAX_UPLOAD_MB: "15"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: K7m!q2Vz
      POSTGRES_DB: nngasu
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U root -d nngasu"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres-data:
  uploads:
