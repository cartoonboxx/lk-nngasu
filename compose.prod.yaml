name: lk-nngasu-prod

services:
  frontend:
    image: ${FRONTEND_IMAGE:?Нужно передать адрес Docker-образа}
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
